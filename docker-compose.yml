services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigma21001
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma_dev_only
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - sigma_pg_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma -d sigma21001"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sigma_pg_data:
